name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Run the notebook end to end
        run: jupyter nbconvert --to notebook --execute --output /tmp/executed.ipynb notebooks/campaign_analysis.ipynb

      - name: Rebuild the Excel model
        run: python excel/build_workbook.py
